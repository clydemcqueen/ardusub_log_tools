[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardusub_log_tools"
version = "2.0.0"
description = "Analysis tools for ArduSub and BlueOS vehicle logs (.BIN, .tlog, .mcap)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pymavlink",
    "folium",
    "requests>=2.33.0",
    "pynmea2",
    "matplotlib",
    "numpy",
    "transforms3d",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "urllib3>=2.7.0",
    "lxml>=6.1.0",
    "idna>=3.15",
    "mcap",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
asl = "ardusub_log_tools.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# A bunch of tools play games with `os.environ["MAVLINK20"] = "1"`; ignore E402 problems for now
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
