[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardusub_log_tools"
version = "0.1.0"
description = "Log analysis tools for ArduSub and BlueOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "branca",
    "folium",
    "matplotlib",
    "mcap",
    "numpy",
    "pandas",
    "pymavlink",
    "pynmea2",
    "transforms3d",
    "zstandard",
]

[project.optional-dependencies]
dev = [
    "jsonschema",
    "pytest",
    "ruff",
]
mavexplorer = [
    "future",
    "lxml",
    "MAVProxy",
    "scipy",
    "setuptools<80",
    "wxPython",
]

[project.scripts]
"BIN_battery.py" = "ardusub_log_tools.BIN_battery:main"
"BIN_ekf_status.py" = "ardusub_log_tools.BIN_ekf_status:main"
"BIN_explode.py" = "ardusub_log_tools.BIN_explode:main"
"BIN_extract_files.py" = "ardusub_log_tools.BIN_extract_files:main"
"BIN_filter.py" = "ardusub_log_tools.BIN_filter:main"
"BIN_graph_alt.py" = "ardusub_log_tools.BIN_graph_alt:main"
"BIN_gyro_bias_stats.py" = "ardusub_log_tools.BIN_gyro_bias_stats:main"
"BIN_info.py" = "ardusub_log_tools.BIN_info:main"
"BIN_mag_3d.py" = "ardusub_log_tools.BIN_mag_3d:main"
"BIN_mag_stats.py" = "ardusub_log_tools.BIN_mag_stats:main"
"BIN_map_maker.py" = "ardusub_log_tools.BIN_map_maker:main"
"BIN_merge.py" = "ardusub_log_tools.BIN_merge:main"
"BIN_messages.py" = "ardusub_log_tools.BIN_messages:main"
"BIN_param.py" = "ardusub_log_tools.BIN_param:main"
"BIN_plot_local.py" = "ardusub_log_tools.BIN_plot_local:main"
"BIN_plot_transect.py" = "ardusub_log_tools.BIN_plot_transect:main"
"BIN_plot_viso.py" = "ardusub_log_tools.BIN_plot_viso:main"
"BIN_timeline.py" = "ardusub_log_tools.BIN_timeline:main"
"check_offset_stability.py" = "ardusub_log_tools.check_offset_stability:main"
"check_rtc_time.py" = "ardusub_log_tools.check_rtc_time:main"
"csv_bad_time.py" = "ardusub_log_tools.csv_bad_time:main"
"dive_logs.py" = "ardusub_log_tools.dive_logs:main"
"map_maker.py" = "ardusub_log_tools.map_maker:main"
"mav_type_echo.py" = "ardusub_log_tools.mav_type_echo:main"
"mcap_channels.py" = "ardusub_log_tools.mcap_channels:main"
"mcap_dump_logs.py" = "ardusub_log_tools.mcap_dump_logs:main"
"mcap_explode.py" = "ardusub_log_tools.mcap_explode:main"
"mcap_explode_extension_logs.py" = "ardusub_log_tools.mcap_explode_extension_logs:main"
"mcap_extract_video.py" = "ardusub_log_tools.mcap_extract_video:main"
"mcap_map_maker.py" = "ardusub_log_tools.mcap_map_maker:main"
"mcap_merge.py" = "ardusub_log_tools.mcap_merge:main"
"mcap_plot_local.py" = "ardusub_log_tools.mcap_plot_local:main"
"mcap_strip_video.py" = "ardusub_log_tools.mcap_strip_video:main"
"mcap_tlog_diff.py" = "ardusub_log_tools.mcap_tlog_diff:main"
"mcap_to_tlog.py" = "ardusub_log_tools.mcap_to_tlog:main"
"mcap_types.py" = "ardusub_log_tools.mcap_types:main"
"mcap_wl_ugps_acoustic_info.py" = "ardusub_log_tools.mcap_wl_ugps_acoustic_info:main"
"mission_dump.py" = "ardusub_log_tools.mission_dump:main"
