"tlog_split_beams.py" = "ardusub_log_tools.tlog_split_beams:main"
"tlog_timeline.py" = "ardusub_log_tools.tlog_timeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testing"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# A bunch of tools play games with `os.environ["MAVLINK20"] = "1"`; ignore E402 problems for now
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
