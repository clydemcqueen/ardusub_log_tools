"tlog_info.py" = "ardusub_log_tools.tlog_info:main"
"tlog_map_maker.py" = "ardusub_log_tools.tlog_map_maker:main"
"tlog_merge.py" = "ardusub_log_tools.tlog_merge:main"
"tlog_messages.py" = "ardusub_log_tools.tlog_messages:main"
"tlog_param.py" = "ardusub_log_tools.tlog_param:main"
"tlog_plot_local.py" = "ardusub_log_tools.tlog_plot_local:main"
